## Domain sub-model: groups media/avatar-related fields from PupilData.
## Phase 1 (additive): coexists with legacy fields on pupil_data.
## Phase 2 (deferred): legacy fields removed from pupil_data after forced migration.
class: PupilMediaData
table: pupil_media_data
fields:
  publicMediaAuth: PublicMediaAuth
  avatar: HubDocument?, relation(optional)
  avatarAuth: HubDocument?, relation(optional)
  publicMediaAuthDocument: HubDocument?, relation(optional)