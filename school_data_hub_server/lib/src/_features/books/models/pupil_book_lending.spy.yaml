class: PupilBookLending
table: pupil_book_lending
fields:
  lendingId: String
  status: String?
  score: int
  bookScore: int?
  lentAt: DateTime
  lentBy: String
  returnedAt: DateTime?
  receivedBy: String?
  pupil: PupilData?, relation(name=pupil_book_lending_pupil, optional)
  isbn: int
  libraryBook: LibraryBook?, relation(name=pupil_book_lending_library_book)
  pupilBookLendingFiles: List<HubDocument>?, relation
  borrowerUser: User?, relation(name=book_lending_user, optional)
  borrowerType: String?
